name: Build Geode Mod

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release (version from mod.json)"
        type: boolean
        default: false
  push:
    branches: ["**"]
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64
          - name: Android64
            os: ubuntu-latest
            target: Android64
          - name: Android32
            os: ubuntu-latest
            target: Android32

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.10.1
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ["build"]
    permissions:
      contents: write

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      # mod.json (номер версии) и changelog.md (описание релиза).
      # Сборка лежит вне рабочей папки, checkout её не трогает.
      - uses: actions/checkout@v4

      # Контрольная сумма для обновления в игре (кладётся рядом с файлом мода)
      - name: Checksum
        run: |
          cd "${{ steps.build.outputs.build-output }}"
          for f in *.geode; do sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"; done

      - uses: actions/upload-artifact@v4
        with:
          name: GSLIntegration
          path: ${{ steps.build.outputs.build-output }}

      # Релиз: Actions → Build Geode Mod → Run workflow → галочка "release". Версия — из mod.json.
      # Основное место — этот репозиторий (оттуда мод берёт обновления, ключ не нужен).
      # Копия в старый GSL-Integration-Releases — для тех, у кого мод до v0.0.11.
      - name: Read version
        id: ver
        run: echo "version=$(python3 -c "import json;print(json.load(open('mod.json'))['version'])")" >> $GITHUB_OUTPUT

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: GSL Integration ${{ steps.ver.outputs.version }}
          body_path: changelog.md
          files: |
            ${{ steps.build.outputs.build-output }}/*.geode
            ${{ steps.build.outputs.build-output }}/*.geode.sha256

      - name: Publish release (old repo, for older versions of the mod)
        if: github.event_name == 'workflow_dispatch' && inputs.release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          repository: Chevo4ek/GSL-Integration-Releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ steps.ver.outputs.version }}
          target_commitish: main
          name: GSL Integration ${{ steps.ver.outputs.version }}
          body_path: changelog.md
          files: |
            ${{ steps.build.outputs.build-output }}/*.geode
            ${{ steps.build.outputs.build-output }}/*.geode.sha256
