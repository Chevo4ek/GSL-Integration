name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64
          - name: Android64
            os: ubuntu-latest
            target: Android64
          - name: Android32
            os: ubuntu-latest
            target: Android32

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.10.1
          # закреплённая рабочая версия bindings (свежие ломают сборку под 2.2081)
          bindings-ref: 7967a43dee568ece099641673be53f897ce19f3f
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ["build"]
    permissions:
      contents: write

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      # Контрольная сумма для обновления в игре (кладётся рядом с файлом мода)
      - name: Checksum
        run: |
          cd "${{ steps.build.outputs.build-output }}"
          for f in *.geode; do sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"; done

      - uses: actions/upload-artifact@v4
        with:
          name: GSLIntegration
          path: ${{ steps.build.outputs.build-output }}

      # Тег вида v0.0.2 -> релиз (пока выкладывается вручную в GSL-Integration-Releases)
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.build.outputs.build-output }}/*.geode
            ${{ steps.build.outputs.build-output }}/*.geode.sha256
