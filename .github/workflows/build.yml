name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v4.4.0
          combine: true
          target: Win64
      - uses: actions/upload-artifact@v4
        with:
          name: GSLIntegration
          path: "${{ github.workspace }}/output/*.geode"
